<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Popup Message Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#15317E;
--primary-light:#2F5EE5;
--success:#16a34a;
--success2:#22c55e;
--danger:#dc2626;

--bg:#edf4ff;
--card:#ffffff;
--border:#d9e5f6;
--text:#1f2937;
--muted:#64748b;

--shadow:
0 15px 35px rgba(15,23,42,.08);

--shadow-hover:
0 25px 55px rgba(15,23,42,.18);

}

body{

background:
linear-gradient(135deg,#edf4ff 0%,#f7fbff 45%,#eef5ff 100%);

min-height:100vh;

padding:45px;

color:var(--text);

}

body::before{

content:"";

position:fixed;
inset:0;

background:

radial-gradient(circle at top right,
rgba(47,94,229,.12),
transparent 38%),

radial-gradient(circle at bottom left,
rgba(21,49,126,.08),
transparent 45%),

radial-gradient(circle at center,
rgba(255,255,255,.55),
transparent 70%);

pointer-events:none;

z-index:-1;

}

.container{

max-width:1200px;

margin:auto;

background:var(--card);

border-radius:30px;

overflow:hidden;

box-shadow:var(--shadow);

border:1px solid rgba(255,255,255,.6);

backdrop-filter:blur(18px);

}

.header{

position:relative;

padding:35px 45px;

background:

linear-gradient(135deg,
#15317E,
#224db8,
#2F5EE5);

color:#fff;

overflow:hidden;

}

.header::before{

content:"";

position:absolute;

width:280px;
height:280px;

border-radius:50%;

background:rgba(255,255,255,.07);

right:-90px;
top:-90px;

}

.header::after{

content:"";

position:absolute;

width:170px;
height:170px;

border-radius:50%;

background:rgba(255,255,255,.05);

left:-60px;
bottom:-60px;

}

.header h1{

position:relative;

font-size:34px;

font-weight:900;

letter-spacing:.3px;

}

.header p{

position:relative;

margin-top:10px;

font-size:15px;

opacity:.95;

line-height:1.7;

max-width:760px;

}

.content{

padding:38px;

display:grid;

gap:30px;

}

.grid{

display:grid;

grid-template-columns:330px 1fr;

gap:30px;

align-items:start;

}

.leftPanel{

background:#f8fbff;

border:1px solid var(--border);

border-radius:22px;

padding:24px;

}

.rightPanel{

background:#fff;

border:1px solid var(--border);

border-radius:22px;

padding:28px;

}

.sectionTitle{

display:flex;

align-items:center;

gap:12px;

margin-bottom:20px;

font-size:18px;

font-weight:800;

color:var(--primary);

}

.icon{

width:42px;

height:42px;

border-radius:14px;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(135deg,#15317E,#2F5EE5);

color:#fff;

font-size:18px;

font-weight:800;

}

label{

display:block;

font-size:14px;

font-weight:700;

margin-bottom:10px;

color:#334155;

}

.selectBox{

position:relative;

}

select{

width:100%;

height:58px;

border-radius:16px;

border:2px solid var(--border);

padding:0 18px;

font-size:15px;

background:#fff;

transition:.3s;

outline:none;

}

select:hover{

border-color:#bfd5fb;

}

select:focus{

border-color:#2F5EE5;

box-shadow:

0 0 0 5px rgba(47,94,229,.12);

}

.userCard{

margin-top:25px;

background:#fff;

border:1px solid var(--border);

border-radius:18px;

padding:20px;

display:flex;

align-items:center;

gap:15px;

}

.avatar{

width:58px;
height:58px;

border-radius:50%;

background:

linear-gradient(135deg,#15317E,#2F5EE5);

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:800;

color:#fff;

}

.userInfo h3{

font-size:16px;

font-weight:800;

margin-bottom:5px;

}

.userInfo p{

font-size:13px;

color:var(--muted);

}

textarea{

width:100%;

height:430px;

resize:vertical;

padding:20px;

border-radius:18px;

border:2px solid var(--border);

outline:none;

font-size:15px;

line-height:1.9;

transition:.3s;

}

textarea:hover{

border-color:#bfd5fb;

}

textarea:focus{

border-color:#2F5EE5;

box-shadow:

0 0 0 5px rgba(47,94,229,.12);

}

.toolbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

flex-wrap:wrap;

gap:12px;

}

.badge{

padding:8px 14px;

border-radius:50px;

background:#eef4ff;

color:#15317E;

font-size:13px;

font-weight:700;

border:1px solid #d8e5ff;

}

.counter{

font-size:13px;

font-weight:700;

color:#64748b;

}

.actionBar{

display:flex;

gap:18px;

margin-top:25px;

flex-wrap:wrap;

}

button{

height:56px;

padding:0 30px;

border:none;

border-radius:16px;

cursor:pointer;

font-size:15px;

font-weight:800;

transition:.35s;

}

button:hover{

transform:translateY(-3px);

box-shadow:var(--shadow-hover);

}

#previewBtn{

background:

linear-gradient(135deg,#16a34a,#22c55e);

color:#fff;

}

#saveBtn{

background:

linear-gradient(135deg,#15317E,#2F5EE5);

color:#fff;

}

#saveStatus{

margin-top:25px;

display:none;

padding:18px;

border-radius:16px;

font-size:15px;

font-weight:700;

border-left:5px solid #16a34a;

background:#ecfdf5;

color:#15803d;

}

.footer{

padding:20px 38px;

background:#f8fbff;

border-top:1px solid var(--border);

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:12px;

}

.footer span{

font-size:13px;

font-weight:600;

color:#64748b;

}

@media(max-width:980px){

body{

padding:20px;

}

.grid{

grid-template-columns:1fr;

}

.header{

padding:30px;

}

.content{

padding:25px;

}

.footer{

padding:20px 25px;

}

}

@media(max-width:600px){

.header h1{

font-size:25px;

}

.header p{

font-size:14px;

}

.content{

padding:18px;

}

.leftPanel,
.rightPanel{

padding:18px;

}

textarea{

height:320px;

}

.actionBar{

flex-direction:column;

}

button{

width:100%;

}

.footer{

flex-direction:column;

align-items:flex-start;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Popup Message Management</h1>

<p>
Create, edit and preview professional popup messages exactly as they will appear before saving them to Firebase.
</p>

</div>

<div class="content">

<div class="grid">

<div class="leftPanel">

<div class="sectionTitle">

<div class="icon">👤</div>

<span>User Selection</span>

</div>

<label>Select User</label>

<div class="selectBox">

<select id="userSelect"></select>

</div>

<div class="userCard">

<div class="avatar" id="avatarLetter">U</div>

<div class="userInfo">

<h3 id="selectedUserName">No User Selected</h3>

<p>Popup recipient</p>

</div>

</div>

</div>

<div class="rightPanel">

<div class="toolbar">

<div class="badge">
Custom Popup Editor
</div>

<div class="counter">
Characters:
<span id="charCount">0</span>
</div>

</div>

<label>Popup Message</label>

<textarea
id="popupMessage"
placeholder="Type HTML, CSS snippets or normal popup messages here..."></textarea>

<div class="actionBar">

<button id="previewBtn">
Preview Popup
</button>

<button id="saveBtn">
Save Message
</button>

</div>

<div id="saveStatus"></div>

</div>

</div>

</div>

<div class="footer">

<span>Professional Popup Message Manager</span>

<span>Firebase Connected</span>

</div>

</div>

<script>

const firebaseConfig={

apiKey:"AIzaSyBK5UM0n8-GLvleW7l6B8Hi-_WuC64QA4U",

authDomain:"scores-b25a7.firebaseapp.com",

databaseURL:"https://scores-b25a7-default-rtdb.firebaseio.com",

projectId:"scores-b25a7",

storageBucket:"scores-b25a7.appspot.com",

messagingSenderId:"1001957936318",

appId:"1:1001957936318:web:90fdfb367f82f6a3d8e2ef"

};

firebase.initializeApp(firebaseConfig);

const userSelect=document.getElementById("userSelect");
const popupMessage=document.getElementById("popupMessage");
const saveBtn=document.getElementById("saveBtn");
const previewBtn=document.getElementById("previewBtn");
const saveStatus=document.getElementById("saveStatus");
const charCount=document.getElementById("charCount");
const avatarLetter=document.getElementById("avatarLetter");
const selectedUserName=document.getElementById("selectedUserName");
const loadUsers = async () => {

const snapshot = await firebase.database().ref("users").once("value");

const users = snapshot.val() || {};

userSelect.innerHTML = "";

for(const uid in users){

const user = users[uid];

const option = document.createElement("option");

option.value = uid;

option.text = user.username || user.fullName || "Unnamed User";

option.dataset.name = option.text;

userSelect.appendChild(option);

}

if(userSelect.options.length){

updateUserCard();

loadMessageForUser(userSelect.value);

}

};

function updateUserCard(){

const option=userSelect.options[userSelect.selectedIndex];

if(!option)return;

const name=option.dataset.name||option.text;

selectedUserName.textContent=name;

avatarLetter.textContent=name.charAt(0).toUpperCase();

}

function loadMessageForUser(uid){

firebase.database()

.ref("users/"+uid)

.once("value")

.then(snapshot=>{

const data=snapshot.val()||{};

popupMessage.value=data.customPopupMessage||"";

charCount.textContent=popupMessage.value.length;

updateUserCard();

});

}

userSelect.addEventListener("change",()=>{

updateUserCard();

loadMessageForUser(userSelect.value);

});

popupMessage.addEventListener("input",()=>{

charCount.textContent=popupMessage.value.length;

});

saveBtn.addEventListener("click",()=>{

const uid=userSelect.value;

const message=popupMessage.value;

saveBtn.disabled=true;

saveBtn.innerHTML="Saving...";

firebase.database()

.ref("users/"+uid)

.update({

customPopupMessage:message

})

.then(()=>{

saveStatus.style.display="block";

saveStatus.innerHTML="✅ Popup message saved successfully.";

setTimeout(()=>{

saveStatus.style.display="none";

},3000);

})

.finally(()=>{

saveBtn.disabled=false;

saveBtn.innerHTML="Save Message";

});

});

previewBtn.addEventListener("click",()=>{

const message=popupMessage.value.trim();

const previewWindow=window.open("","_blank","width=760,height=720");

previewWindow.document.write(`

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Popup Preview</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Inter,sans-serif;

}

body{

background:

linear-gradient(135deg,#0f172a,#1e3a8a);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

overflow:auto;

}

.popup{

width:100%;

max-width:760px;

background:#fff;

border-radius:24px;

overflow:hidden;

box-shadow:

0 30px 70px rgba(0,0,0,.45);

animation:show .28s ease;

}

.header{

padding:22px 28px;

background:

linear-gradient(135deg,#15317E,#2F5EE5);

color:#fff;

font-size:24px;

font-weight:800;

display:flex;

justify-content:space-between;

align-items:center;

}

.header span{

font-size:13px;

font-weight:600;

background:rgba(255,255,255,.18);

padding:7px 14px;

border-radius:30px;

}

.content{

padding:35px;

font-size:16px;

line-height:1.9;

color:#374151;

overflow:auto;

max-height:60vh;

}

.footer{

padding:22px 28px;

display:flex;

justify-content:flex-end;

gap:15px;

background:#f8fafc;

border-top:1px solid #e5e7eb;

}

button{

height:48px;

padding:0 28px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:15px;

font-weight:700;

transition:.25s;

}

.close{

background:#15317E;

color:#fff;

}

.close:hover{

background:#2F5EE5;

}

@keyframes show{

from{

opacity:0;

transform:translateY(30px) scale(.9);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}

</style>

</head>

<body>

<div class="popup">

<div class="header">

<div>Popup Preview</div>

<span>Live Rendering</span>

</div>

<div class="content" id="previewContent"></div>

<div class="footer">

<button class="close" onclick="window.close()">

Close Preview

</button>

</div>

</div>

<script>

const msg=${JSON.stringify(message)};

const container=document.getElementById("previewContent");

if(msg.trim().startsWith("<")){

container.innerHTML=msg;

}else{

container.innerHTML=msg.replace(/\\n/g,"<br>");

}

<\/script>

</body>

</html>

`);

previewWindow.document.close();

});

loadUsers();

</script>

</body>

</html>
